# Follows quer3q/ampr-emu-ng (main) and quer3q/ps5-dump-forge (releases) only:
# when either has something new, tools/quer3q_update.py moves the pins
# (checking upstream's SHA256SUMS), Trail-Code reports
# the blast radius of upstream's change, the NAS tests and the image build
# (runtime tests and PRX verifier) run, and a pull request to main is opened.
# Nothing reaches main or the NAS image until someone merges it.
name: Follow quer3q

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: quer3q-update

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Trail-Code
        run: npm install -g @trailhq/trail-code@0.28.1 && trail --version

      - name: Look for new versions and move the pins
        id: up
        env:
          DO_NOT_TRACK: '1'
          TRAIL_NO_LOOK_BACK: '1'
        run: |
          set -euo pipefail
          python3 tools/quer3q_update.py --apply --trail --report "$RUNNER_TEMP/report.md" | tee "$RUNNER_TEMP/out.txt"
          changed=$(sed -n 's/^changed=//p' "$RUNNER_TEMP/out.txt")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "pins=$(sed -n 's/^pins=//p' "$RUNNER_TEMP/out.txt")" >> "$GITHUB_OUTPUT"
          echo "branch=quer3q-$(git diff --quiet || git diff | sha256sum | cut -c1-10)" >> "$GITHUB_OUTPUT"

      - name: NAS tests
        if: steps.up.outputs.changed == 'true'
        run: python3 -m unittest discover -s tests/nas

      - name: Build the image (ampr-emu-ng host tests, PRX verifier, Forge)
        if: steps.up.outputs.pins == 'true'
        run: docker build -t ps5-lz4:quer3q -f nas-lz4/Dockerfile .

      - name: Open a pull request
        if: steps.up.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.up.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "$BRANCH is already open for review"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add -A nas-lz4 THIRD_PARTY_NOTICES.md
          git commit -q -m "Updates from quer3q" -m "$(head -c 60000 "$RUNNER_TEMP/report.md")"
          git push -q origin "$BRANCH"
          { echo "Found and checked by the Follow quer3q workflow."
            echo
            if [ "${{ steps.up.outputs.pins }}" = true ]; then
              echo "NAS tests and the image build (ampr-emu-ng host tests, PRX verifier) passed."
            else
              echo "No pin moved."
            fi
            echo "Review before merging: merging rebuilds the NAS image. Not tested on a PS5."
            echo
            cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$BRANCH" --title "Updates from quer3q (ampr-emu-ng, PS5 Dump Forge)" \
            --body-file "$RUNNER_TEMP/body.md" \
            || echo "::warning::could not open the pull request (allow Actions to create pull requests in Settings > Actions); the branch $BRANCH has the changes"

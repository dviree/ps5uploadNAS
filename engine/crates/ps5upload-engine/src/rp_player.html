<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Play (spike)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0d; color: #ddd; font: 13px system-ui, sans-serif; }
  form { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; align-items: center; }
  input, select, button { background: #1b1b20; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; }
  canvas { display: block; width: 100%; max-height: calc(100vh - 110px); object-fit: contain; background: #000; outline: none; }
  #stats { padding: 4px 10px; font-family: ui-monospace, monospace; color: #8c8; white-space: pre-wrap; }
  details { padding: 0 10px 6px; color: #999; }
  table { border-collapse: collapse; } td { padding: 1px 10px 1px 0; }
</style>
</head>
<body>
<form id="f">
  <input id="host" placeholder="PS5 address" size="14">
  <input id="regist" type="password" placeholder="regist key (hex)" size="20" autocomplete="off">
  <input id="rp" type="password" placeholder="RP key (hex)" size="20" autocomplete="off">
  <select id="res"><option value="1280x720">720p</option><option value="1920x1080">1080p</option></select>
  <select id="codec"><option value="auto">Auto (HEVC if this device can)</option><option value="h265">HEVC</option><option value="h264">H.264</option></select>
  <button id="go" type="submit">Start</button>
  <button id="stop" type="button">Stop</button>
</form>
<div id="stats">idle</div>
<details><summary>Keyboard (click the picture first)</summary>
<table>
<tr><td>Arrows</td><td>D-pad</td><td>WASD</td><td>left stick</td><td>IJKL</td><td>right stick</td></tr>
<tr><td>Enter / Space</td><td>✕ Cross</td><td>Backspace / Esc</td><td>○ Circle</td><td>Q</td><td>□ Square</td><td>E</td><td>△ Triangle</td></tr>
<tr><td>Z / C</td><td>L1 / R1</td><td>1 / 3</td><td>L2 / R2</td><td>F / G</td><td>L3 / R3</td></tr>
<tr><td>Tab</td><td>Options</td><td>`</td><td>Create</td><td>H</td><td>PS button</td><td>T</td><td>touchpad press</td></tr>
</table>
</details>
<canvas id="c" width="1280" height="720" tabindex="0"></canvas>
<script>
const $ = (id) => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");

// ---- pad state -------------------------------------------------------------
const B = { CROSS: 1, CIRCLE: 2, SQUARE: 4, TRIANGLE: 8, LEFT: 16, RIGHT: 32, UP: 64, DOWN: 128,
  L1: 256, R1: 512, L3: 1024, R3: 2048, OPTIONS: 4096, SHARE: 8192, TOUCHPAD: 16384, PS: 32768 };
const KEY_BUTTONS = {
  ArrowUp: B.UP, ArrowDown: B.DOWN, ArrowLeft: B.LEFT, ArrowRight: B.RIGHT,
  Enter: B.CROSS, Space: B.CROSS, Backspace: B.CIRCLE, Escape: B.CIRCLE,
  KeyQ: B.SQUARE, KeyE: B.TRIANGLE, KeyZ: B.L1, KeyC: B.R1, KeyF: B.L3, KeyG: B.R3,
  Tab: B.OPTIONS, Backquote: B.SHARE, KeyH: B.PS, KeyT: B.TOUCHPAD,
};
const STICK_KEYS = { KeyW: ["ly", -1], KeyS: ["ly", 1], KeyA: ["lx", -1], KeyD: ["lx", 1],
  KeyI: ["ry", -1], KeyK: ["ry", 1], KeyJ: ["rx", -1], KeyL: ["rx", 1] };
const held = new Set();
function keyPad() {
  const p = { buttons: 0, l2: 0, r2: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
  for (const code of held) {
    if (KEY_BUTTONS[code]) p.buttons |= KEY_BUTTONS[code];
    if (STICK_KEYS[code]) { const [ax, d] = STICK_KEYS[code]; p[ax] += d * 32767; }
    if (code === "Digit1") p.l2 = 255;
    if (code === "Digit3") p.r2 = 255;
  }
  return p;
}
// Gamepad API, "standard" mapping.
const GP = [B.CROSS, B.CIRCLE, B.SQUARE, B.TRIANGLE, B.L1, B.R1, 0, 0, B.SHARE, B.OPTIONS, B.L3, B.R3,
  B.UP, B.DOWN, B.LEFT, B.RIGHT, B.PS, B.TOUCHPAD];
function gamepadPad() {
  const p = { buttons: 0, l2: 0, r2: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
  for (const g of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!g || g.mapping !== "standard") continue;
    g.buttons.forEach((b, i) => { if (b.pressed && GP[i]) p.buttons |= GP[i]; });
    p.l2 = Math.max(p.l2, Math.round((g.buttons[6]?.value || 0) * 255));
    p.r2 = Math.max(p.r2, Math.round((g.buttons[7]?.value || 0) * 255));
    const ax = (v) => (Math.abs(v) < 0.08 ? 0 : Math.round(v * 32767));
    p.lx = ax(g.axes[0] || 0); p.ly = ax(g.axes[1] || 0); p.rx = ax(g.axes[2] || 0); p.ry = ax(g.axes[3] || 0);
  }
  return p;
}
const clamp = (v) => Math.max(-32768, Math.min(32767, v));
let lastSent = "";
// Test hook: a pad state pushed from outside (automation), merged in.
window.rpExtra = { buttons: 0, l2: 0, r2: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
function sendPad() {
  const k = keyPad(), g = gamepadPad(), x = window.rpExtra;
  const p = {
    buttons: k.buttons | g.buttons | x.buttons, l2: Math.max(k.l2, g.l2, x.l2), r2: Math.max(k.r2, g.r2, x.r2),
    lx: clamp(k.lx + g.lx + x.lx), ly: clamp(k.ly + g.ly + x.ly), rx: clamp(k.rx + g.rx + x.rx), ry: clamp(k.ry + g.ry + x.ry),
  };
  const s = JSON.stringify(p);
  if (s !== lastSent && ws && ws.readyState === 1) { ws.send(JSON.stringify({ pad: p })); lastSent = s; st.inputs++; st.lastInputAt = performance.now(); }
}
// Gamepads have no events: poll them every frame. Keys send at once, so a tap
// shorter than a frame still reaches the console as a press and a release.
function pollPad() { sendPad(); requestAnimationFrame(pollPad); }
canvas.addEventListener("keydown", (e) => { if (KEY_BUTTONS[e.code] || STICK_KEYS[e.code] || e.code.startsWith("Digit")) { held.add(e.code); e.preventDefault(); sendPad(); } });
canvas.addEventListener("keyup", (e) => { held.delete(e.code); e.preventDefault(); sendPad(); });
canvas.addEventListener("blur", () => held.clear());

// ---- stream ----------------------------------------------------------------
let ws = null;
const st = { stage: "idle", frames: 0, decoded: 0, bytes: 0, t0: 0, first: 0, lastDecodeMs: 0, fps: 0, err: "", inputs: 0, lastInputAt: 0, audio: 0 };
function show() {
  $("stats").textContent =
    `stage ${st.stage}  frames ${st.frames}  decoded ${st.decoded}  ${st.fps} fps  ` +
    `${(st.bytes / 1e6).toFixed(1)} MB  first frame ${st.first ? st.first + " ms" : "-"}  ` +
    `decode ${st.lastDecodeMs.toFixed(1)} ms  ${st.codec || ""}  inputs ${st.inputs}  audio ${st.audio}${st.err ? "  error: " + st.err : ""}`;
}
setInterval(() => { st.fps = st.decoded - (st._lastDecoded || 0); st._lastDecoded = st.decoded; show(); }, 1000);

function avcCodec(header) {
  for (let i = 0; i + 4 < header.length; i++) {
    if (header[i] === 0 && header[i + 1] === 0 && header[i + 2] === 1 && (header[i + 3] & 0x1f) === 7) {
      const h = (b) => b.toString(16).padStart(2, "0");
      return "avc1." + h(header[i + 4]) + h(header[i + 5]) + h(header[i + 6]);
    }
  }
  return "avc1.4d4028";
}
let hevc = false;
function isKey(au) {
  for (let i = 0; i + 3 < au.length; i++) {
    if (au[i] === 0 && au[i + 1] === 0 && au[i + 2] === 1) {
      if (hevc) {
        const t = (au[i + 3] >> 1) & 0x3f;
        if (t >= 16 && t <= 21) return true; // IRAP: BLA/IDR/CRA
        if (t < 16) return false;
      } else {
        const t = au[i + 3] & 0x1f;
        if (t === 5) return true;
        if (t === 1) return false;
      }
    }
  }
  return false;
}
// HEVC: the first codec string this browser can decode (Main, then Main 10).
async function hevcCodec(w, h) {
  for (const c of ["hev1.1.6.L153.B0", "hvc1.1.6.L153.B0", "hev1.2.4.L153.B0", "hvc1.2.4.L153.B0", "hev1.1.6.L150.90"]) {
    try { if ((await VideoDecoder.isConfigSupported({ codec: c, codedWidth: w, codedHeight: h })).supported) return c; } catch (_) {}
  }
  return null;
}

let decoder = null, header = null, ts = 0, sawKey = false;
const queued = [];
const sentAt = new Map();
function onVideo(kind, payload) {
  if (kind === 0) {
    header = payload;
    if (!decoder) {
      decoder = new VideoDecoder({
        output: (frame) => {
          const t = sentAt.get(frame.timestamp);
          if (t !== undefined) { st.lastDecodeMs = performance.now() - t; sentAt.delete(frame.timestamp); }
          if (!st.first) st.first = Math.round(performance.now() - st.t0);
          ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
          frame.close();
          st.decoded++;
          if (window.rpOnFrame) window.rpOnFrame(performance.now());
        },
        error: (err) => { st.err = String(err); show(); },
      });
      const cfg = { optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" };
      if (hevc) {
        decoder.pending = hevcCodec(canvas.width, canvas.height).then((c) => {
          if (!c) { st.err = "this browser cannot decode HEVC"; return; }
          st.codec = c;
          decoder.configure({ codec: c, ...cfg });
          for (const q of queued) decoder.decode(q);
          queued.length = 0;
        });
      } else {
        st.codec = avcCodec(header);
        decoder.configure({ codec: st.codec, ...cfg });
      }
    }
    return;
  }
  st.frames++; st.bytes += payload.length;
  const key = isKey(payload);
  if (!sawKey && !key) return;
  let data = payload;
  if (key && header) { data = new Uint8Array(header.length + payload.length); data.set(header); data.set(payload, header.length); }
  sawKey = true;
  ts += 16667;
  sentAt.set(ts, performance.now());
  const chunk = new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: ts, data });
  if (decoder.state !== "configured") { queued.push(chunk); return; } // HEVC config still being probed
  decoder.decode(chunk);
}
// ---- audio: Opus via WebCodecs, played ~60 ms ahead -------------------------
// Video frames are drawn the moment they decode, so audio is kept just far
// enough ahead to ride out network jitter: that holds the two within a few
// tens of milliseconds. Too far behind (an underrun) or ahead (a stall that
// piled frames up) and the schedule resets to the target.
const AUDIO_TARGET = 0.06, AUDIO_MAX = 0.25;
let actx = null, adec = null, aNext = 0, aLastIdx = -1, aRate = 48000, aFrame = 480;
window.rpAudioLog = [];
function onAudio(kind, payload) {
  if (kind === 3) {
    const dv = new DataView(payload.buffer, payload.byteOffset);
    const ch = payload[0];
    aRate = dv.getUint32(2); aFrame = dv.getUint32(6);
    if (!actx) actx = new AudioContext({ sampleRate: aRate, latencyHint: "interactive" });
    adec = new AudioDecoder({
      output: (data) => {
        const n = data.numberOfFrames, buf = actx.createBuffer(data.numberOfChannels, n, data.sampleRate);
        let sum = 0;
        for (let c = 0; c < data.numberOfChannels; c++) {
          const plane = new Float32Array(n);
          data.copyTo(plane, { planeIndex: c, format: "f32-planar" });
          buf.copyToChannel(plane, c);
          if (c === 0) for (let i = 0; i < n; i++) sum += plane[i] * plane[i];
          if (c === 0 && window.rpPcm) window.rpPcm.push(Array.from(plane)); // test capture
        }
        data.close();
        const now = actx.currentTime;
        if (aNext < now + 0.01 || aNext > now + AUDIO_MAX) aNext = now + AUDIO_TARGET;
        const src = actx.createBufferSource();
        src.buffer = buf; src.connect(actx.destination); src.start(aNext);
        // When it will be heard, on the page's clock.
        const heardAt = performance.now() + (aNext - now + (actx.outputLatency || 0)) * 1000;
        window.rpAudioLog.push([heardAt, Math.sqrt(sum / n)]);
        if (window.rpAudioLog.length > 2000) window.rpAudioLog.splice(0, 1000);
        aNext += n / data.sampleRate;
        st.audio++;
      },
      error: (e) => { st.err = "audio: " + e; },
    });
    adec.configure({ codec: "opus", sampleRate: aRate, numberOfChannels: ch });
    return;
  }
  if (!adec) return;
  const idx = (payload[0] << 8) | payload[1];
  // Frames come in order; a late copy of one already played is dropped.
  if (aLastIdx >= 0 && ((idx - aLastIdx) & 0xffff) >= 0x8000) return;
  aLastIdx = idx;
  adec.decode(new EncodedAudioChunk({ type: "key", timestamp: idx * (aFrame / aRate) * 1e6, data: payload.subarray(2) }));
}

// HEVC carries the same picture in fewer bits, so it is the default whenever
// this device can decode it; the PS5 offers only H.264 and HEVC.
async function pickCodec(w, h) {
  const want = $("codec").value;
  if (want !== "auto") return want;
  return (await hevcCodec(w, h)) ? "h265" : "h264";
}

async function start(e) {
  e.preventDefault();
  stop();
  Object.assign(st, { stage: "connecting", frames: 0, decoded: 0, bytes: 0, first: 0, err: "", inputs: 0, audio: 0 });
  decoder = null; header = null; ts = 0; sawKey = false;
  adec = null; aNext = 0; aLastIdx = -1; queued.length = 0;
  if (!actx) actx = new AudioContext({ latencyHint: "interactive" }); // created in the click, so it may play
  actx.resume();
  const [w, h] = $("res").value.split("x").map(Number);
  canvas.width = w; canvas.height = h;
  const codec = await pickCodec(w, h);
  hevc = codec === "h265";
  st.t0 = performance.now();
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/ps5/rp/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => ws.send(JSON.stringify({ host: $("host").value, regist_key: $("regist").value, rp_key: $("rp").value, width: w, height: h, codec }));
  ws.onmessage = (m) => {
    if (typeof m.data === "string") {
      const s = JSON.parse(m.data);
      st.stage = s.stage; if (s.error) st.err = s.error; show();
      return;
    }
    const b = new Uint8Array(m.data), kind = b[0], payload = b.subarray(1);
    if (kind <= 1) onVideo(kind, payload); else onAudio(kind, payload);
  };
  ws.onclose = () => { if (st.stage !== "error") st.stage = "ended"; show(); };
  canvas.focus();
}
// Stop asks the engine to end the stream; the engine closes the socket after
// its final status, so the page sees why and how it ended.
function stop() {
  if (!ws) return;
  const w = ws; ws = null;
  try { w.send(JSON.stringify({ stop: true })); } catch (_) {}
  setTimeout(() => w.close(), 3000); // in case the engine never answers
}
$("f").addEventListener("submit", start);
$("stop").addEventListener("click", stop);
requestAnimationFrame(pollPad);
</script>
</body>
</html>

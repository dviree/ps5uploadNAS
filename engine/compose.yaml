# ps5upload engine + web UI, with the LZ4 Compression engine beside it, on a
# Linux server (homelab, NAS, mini PC). Both are built from this repository.
#
#   docker compose -f engine/compose.yaml up -d --build
#
# Replacing a PS5-LZ4-NAS container you run already: remove it first
# (`docker rm -f lz4-compression`, or `docker compose -f nas/docker-compose.yml
# down` in that copy), since this file uses the same name and port 5920.
#   then open http://<this server's LAN IP>:19113 from a browser on your LAN,
#   or point the desktop app at it: Settings → Engine URL.
#
# Edit the three values marked EDIT first.

services:
  ps5upload:
    # Built from this repository, so the web UI has the LZ4 Convert Games page.
    # (The published ghcr.io/phantomptr/ps5upload-engine-webui image doesn't.)
    build:
      context: ..
      dockerfile: engine/Dockerfile.webui
    image: ps5upload-lz4
    container_name: ps5upload
    restart: unless-stopped

    # Host networking, so the PS5 can reach the engine. A stream install makes
    # the PS5 download the package FROM the engine; with Docker's default
    # bridge network the engine would give the PS5 its internal 172.17.x.x
    # address, which the PS5 cannot reach, and every stream install fails.
    # (Docker Desktop on macOS/Windows can't do host networking: publish the
    # port instead and set PS5UPLOAD_PKG_HOST_IP to that computer's LAN IP.)
    network_mode: host

    environment:
      # EDIT: your PS5's IP address.
      PS5_ADDR: "192.168.1.50"
      # EDIT: who may use the engine. It has NO password — anyone allowed here
      # can install, delete and read files on your PS5. Your LAN's range is the
      # usual choice; keep it to networks you trust. Never expose the engine
      # to the internet.
      PS5UPLOAD_ALLOW_IP: "192.168.1.0/24"
      # Where the web UI's file browser opens: your PS5 and PS4 ROMs and the
      # LZ4 folder (mounted below). Comma-separated.
      PS5UPLOAD_BROWSE_ROOTS: "/roms/ps5,/roms/ps4,/lz4"
      # Only needed without host networking: this server's LAN IP.
      # PS5UPLOAD_PKG_HOST_IP: "192.168.1.10"

    # Synology and other NAS boxes: the container runs as UID 65532 unless told
    # otherwise, and your bind mount is owned by someone else. Pick ONE:
    #   - run as the folder's owner: `user: "1234:77777"` (see `ls -ln` on the
    #     host folder), or
    #   - `chown -R 65532:65532 /volume1/docker/ps5upload/data` on the host.
    # (A USER_ID/GROUP_ID environment variable is not read by these images.)
    # user: "1234:77777"

    volumes:
      # The engine's own state: saved servers, install history, artwork cache.
      - ps5upload-data:/data
      # EDIT: your folders. ROMs PS5 and ROMs PS4 hold the packages and game
      # folders; the LZ4 folder is the same one the LZ4 Compression engine
      # works in below, so packed games show up here too.
      - /srv/roms/ps5:/roms/ps5
      - /srv/roms/ps4:/roms/ps4
      - /srv/lz4:/lz4


  # The LZ4 Compression engine (lz4/), shown on the Convert Games page. It runs
  # entirely here and works on the games in the folder mounted at
  # /data/homebrew. See lz4/nas/README.md for the folders and options.
  lz4-compression:
    build:
      context: ../lz4
    image: lz4-compression-nas
    container_name: lz4-compression
    restart: unless-stopped
    ports:
      - "5920:5920"
    environment:
      # Your NAS user and group IDs, so new files stay editable over SMB/NFS
      # (`id <user>` over SSH; Synology is often 1026 / 100). 0 runs as root.
      - PUID=1000
      - PGID=1000
    volumes:
      # Settings, history, logs and uploaded TOML profiles. To keep the ones
      # from a PS5-LZ4-NAS container, mount its config folder here instead,
      # e.g. /volume1/docker/PS5-LZ4-NAS/nas/config:/data/LZ4Compression
      - lz4-config:/data/LZ4Compression
      # EDIT: the LZ4 folder, as in your PS5-LZ4-NAS container: one folder per
      # game (or .exfat/.ffpfs/.ffpfsc images). Shown as "Internal" in the page.
      - /srv/lz4:/data/homebrew
      # Your PS5 ROMs as a second library and copy/move target ("External SSD").
      - /srv/roms/ps5:/mnt/ext0/homebrew
    # Only needed to read games stored as .exfat images: uncomment both and
    # set PUID=0 above (loop mounts need root).
    # privileged: true
    # devices:
    #   - /dev/loop-control

volumes:
  ps5upload-data:
  lz4-config:
